
<canvas id="c" style="display:block;width:100%;height:420px;background:#08080f;border-radius:12px;"></canvas>
<p style="text-align:center;font-size:13px;color:var(--color-text-secondary);margin-top:8px;">클릭하면 폭죽 터져</p>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = canvas.offsetWidth;
canvas.height = 420;

const W = canvas.width, H = canvas.height;
const particles = [];
const colors = ['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#ff9f45','#c77dff','#ffffff'];
const burstParticleCount = 60;

class Particle {
  constructor(x, y, burst) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = burst ? (Math.random() * 7 + 2) : (Math.random() * 2 + 0.5);
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (burst ? 2 : 0);
    this.life = 1;
    this.decay = burst ? (Math.random() * 0.018 + 0.01) : (Math.random() * 0.012 + 0.006);
    this.size = burst ? (Math.random() * 4 + 1) : (Math.random() * 2 + 0.5);
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.gravity = burst ? 0.12 : 0.03;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += this.gravity; this.vx *= 0.98;
    this.life -= this.decay; this.size *= 0.97;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.life;
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function burst(x, y, count) {
  for (let i = 0; i < count; i++) particles.push(new Particle(x, y, true));
}

let frame = 0;
let blinkOn = true;
let blinkTimer = 0;
const blinkInterval = 22;

const dots = [];
const dotCount = 28;
for (let i = 0; i < dotCount; i++) {
  dots.push({ phase: (i / dotCount) * Math.PI * 2 });
}

function drawSign() {
  const cx = W / 2, cy = H / 2 - 20;
  const bw = Math.min(W - 60, 520), bh = 160;
  const bx = cx - bw / 2, by = cy - bh / 2;

  ctx.save();
  ctx.fillStyle = '#0d0d1a';
  ctx.strokeStyle = '#ffd93d';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.roundRect(bx, by, bw, bh, 12);
  ctx.fill();
  ctx.stroke();
  ctx.restore();

  // 전구 효과
  dots.forEach((dot, i) => {
    const t = frame * 0.05 + dot.phase;
    const on = Math.sin(t) > 0.2;
    const px = bx + (i / dotCount) * bw;
    const py = by + (i % 2 === 0 ? -6 : bh + 6);
    const dotY = i < dotCount / 2 ? by - 6 : by + bh + 6;
    const dotX = i < dotCount / 2
      ? bx + (i / (dotCount / 2)) * bw
      : bx + bw - ((i - dotCount / 2) / (dotCount / 2)) * bw;

    ctx.save();
    ctx.beginPath();
    ctx.arc(dotX, dotY, 5, 0, Math.PI * 2);
    ctx.fillStyle = on ? '#ffd93d' : '#3a3010';
    ctx.shadowColor = on ? '#ffd93d' : 'transparent';
    ctx.shadowBlur = on ? 10 : 0;
    ctx.fill();
    ctx.restore();

    if (on && Math.random() < 0.003) {
      particles.push(new Particle(dotX, dotY, false));
    }
  });

  // 메인 텍스트
  ctx.save();
  const fontSize = Math.min(bw / 7, 54);
  ctx.font = `900 ${fontSize}px 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  if (blinkOn) {
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 24;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('🏖 ㅇㅇ해변 개장!', cx, cy - 18);
  }
  ctx.restore();

  // 서브 텍스트
  ctx.save();
  ctx.font = `500 ${Math.min(bw / 16, 22)}px 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd93d';
  ctx.shadowColor = '#ffd93d';
  ctx.shadowBlur = 10;
  ctx.fillText('올 여름도 함께해요 ✨', cx, cy + 38);
  ctx.restore();
}

let autoTimer = 0;
function autoFirework() {
  autoTimer++;
  if (autoTimer % 90 === 0) {
    const x = W * 0.2 + Math.random() * W * 0.6;
    const y = H * 0.1 + Math.random() * H * 0.4;
    burst(x, y, burstParticleCount);
  }
  if (autoTimer % 35 === 0) {
    const cx = W / 2;
    const cy = H / 2 - 20;
    const bw = Math.min(W - 60, 520);
    burst(cx - bw / 2 + Math.random() * bw, cy - 80 + Math.random() * 160, burstParticleCount);
  }
}

function loop() {
  frame++;
  blinkTimer++;
  if (blinkTimer >= blinkInterval) { blinkOn = !blinkOn; blinkTimer = 0; }

  ctx.fillStyle = 'rgba(8,8,15,0.18)';
  ctx.fillRect(0, 0, W, H);

  autoFirework();
  drawSign();

  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) particles.splice(i, 1);
  }
  requestAnimationFrame(loop);
}

canvas.addEventListener('click', e => {
  const r = canvas.getBoundingClientRect();
  burst(e.clientX - r.left, e.clientY - r.top, burstParticleCount);
});

loop();
</script>
